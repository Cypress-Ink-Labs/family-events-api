# Railway service config (railpack). Healthcheck is /healthz (liveness, no DB) so
# a database hiccup does not restart-loop the container; /readyz is the DB-pinging
# readiness probe for platforms that support a second probe. If the health route
# moves, this file moves with it.

[build]
builder = "RAILPACK"
buildCommand = "corepack enable && pnpm install --frozen-lockfile && pnpm build"

[deploy]
startCommand = "node dist/src/main.js"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
